<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGradM" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="emeraldGradM" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="goldGradM" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
  </defs>

  <!-- Full background for maskable cropping without transparency holes -->
  <rect width="512" height="512" fill="url(#bgGradM)" />
  
  <!-- Safe Zone Circle guide content -->
  <circle cx="256" cy="256" r="185" fill="#0d1527" stroke="url(#emeraldGradM)" stroke-width="12" />

  <!-- Car Symbol scaled inside safe zone -->
  <path d="M175 275 L196 225 C202 212 215 204 229 204 L283 204 C297 204 310 212 316 225 L337 275 Z" fill="url(#emeraldGradM)" />
  <path d="M152 275 L360 275 C373 275 382 285 380 298 L372 334 C370 343 362 350 352 350 L160 350 C150 350 142 343 140 334 L132 298 C130 285 139 275 152 275 Z" fill="url(#emeraldGradM)" />
  
  <!-- Windshield -->
  <path d="M205 228 L242 228 L242 262 L190 262 Z" fill="#0d1527" />
  <path d="M270 228 L307 228 L322 262 L270 262 Z" fill="#0d1527" />

  <!-- Headlights -->
  <circle cx="170" cy="310" r="15" fill="#ffffff" />
  <circle cx="342" cy="310" r="15" fill="#ffffff" />

  <!-- Dollar Badge -->
  <circle cx="256" cy="170" r="42" fill="url(#goldGradM)" />
  <text x="256" y="185" font-family="Arial, sans-serif" font-size="44" font-weight="900" fill="#0f172a" text-anchor="middle">$</text>

  <!-- AGC Text -->
  <text x="256" y="410" font-family="Arial, sans-serif" font-size="38" font-weight="900" fill="#ffffff" letter-spacing="5" text-anchor="middle">AGC</text>
</svg>